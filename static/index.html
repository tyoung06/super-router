<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="sr-token" content="__SR_TOKEN__">
<meta name="sr-demo" content="__SR_DEMO__">
<meta name="sr-reveal" content="__SR_REVEAL__">
<title>Super Router</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Go to"></nav>
  <nav class="sidebar" id="sidebar" aria-label="Workspace"></nav>
  <main class="main" id="main">
    <div class="banners" id="banners"></div>
    <header class="strip" id="strip" aria-label="Agents"></header>
    <section class="stream" id="stream" aria-label="Tasks"></section>
    <footer class="composer-area" id="composer-area">
      <div class="composer" id="composer">
        <label class="sr-only" for="prompt" id="prompt-label">New task</label>
        <div class="composer-pills">
          <span class="chip-tag pill-skill" id="skill-pill" hidden></span>
          <span class="chip-tag pill-from" id="from-pill" hidden></span>
          <span class="chip-tag pill-idea" id="idea-pill" hidden></span>
          <span class="chip-tag pill-textonly" id="textonly-pill" hidden></span>
          <span class="chip-tag pill-step" id="step-pill" hidden></span>
          <span class="model-pills" id="model-pills" hidden></span>
        </div>
        <textarea id="prompt" rows="2" placeholder="New task" spellcheck="true"></textarea>
        <div class="composer-files" id="files" aria-label="Files on this task"></div>
        <div class="slots" id="slots" hidden></div>
        <div class="composer-bar">
          <div class="plus">
            <button class="plus-btn" type="button" aria-label="Options: attach files, skill, web search, Quick task, project" aria-haspopup="true" aria-expanded="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="plus-menu" role="group" aria-label="Task options" hidden>
              <button class="plus-item attach" id="attach" type="button" aria-label="Attach a file"><span class="plus-name">Attach files</span><span class="plus-state"></span></button>
              <label class="plus-item plus-skill"><span class="plus-name">Skill</span><span class="plus-state"></span><select class="select" id="skill" aria-label="Skill"></select></label>
              <label class="plus-item toggle" id="web-label"><span class="plus-name">Web search</span><span class="plus-state"></span><input type="checkbox" id="web"></label>
              <label class="plus-item toggle" id="quick-label" title="No chat, no memory"><span class="plus-name">Quick task</span><span class="plus-state"></span><input type="checkbox" id="quick"></label>
              <div class="plus-divider" role="separator"></div>
              <label class="plus-item plus-project"><span class="plus-name">Project</span><span class="plus-state"></span><select class="select" id="project" aria-label="Project"></select></label>
            </div>
          </div>
          <div class="team" id="team"></div>
          <span class="chip-tag" id="context-tag"></span>
          <button class="btn btn-primary btn-lg send" id="send" type="button">Send · Route</button>
          <input type="file" id="file-input" multiple hidden>
        </div>
      </div>
      <div class="under">
      <div class="cmdline" id="cmdline" aria-label="The command Enter will run">
        <span class="prompt">$</span><span class="cmd" id="cmd"></span>
        <button class="icon-btn" id="copy" type="button" aria-label="Copy the command">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>
      <div class="jev" id="jev" aria-label="Jev confidence"></div>
      </div>
    </footer>
  </main>
  <aside class="panel" id="panel" aria-label="Side panel" hidden></aside>
</div>
<div class="nav-backdrop" id="nav-backdrop" hidden></div>
<div class="sheet-backdrop" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<a id="control-page" href="http://127.0.0.1:9999/" hidden></a>
<code id="control-start" hidden>npx @vectorize-io/hindsight-control-plane@1.1.0 --hostname 127.0.0.1 --port 9999 --api-url http://127.0.0.1:8888</code>
<script type="module" src="/static/app.js"></script>
</body>
</html>
